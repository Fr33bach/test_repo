<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthwave Pong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #ff00ff;
            background-color: #0a0a0a;
        }

        canvas {
            display: block;
        }

        /* CRT Scanline Overlay */
        #game-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            z-index: 15;
            pointer-events: none;
        }

        .ui {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #00ffff;
            font-size: 24px;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 10;
        }

        .instructions {
            position: absolute;
            bottom: -50px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            text-align: center;
            width: 100%;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        #menu-overlay h1 {
            font-size: 60px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        .menu-button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .menu-button:hover {
            background: #00ffff;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="ui">
            <div id="score-left">0</div>
            <div id="score-right">0</div>
        </div>
        <canvas id="pongCanvas" width="800" height="500"></canvas>
        <div id="menu-overlay">
            <h1>Synthwave Pong</h1>
            <button class="menu-button" id="btn-2p">2 Player Mode</button>
            <button class="menu-button" id="btn-ai">Player vs AI Mode</button>
        </div>
    </div>
    <div class="instructions">
        Left: W/S | Right: Up/Down Arrows
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const scoreLeftElement = document.getElementById('score-left');
        const scoreRightElement = document.getElementById('score-right');
        const menuOverlay = document.getElementById('menu-overlay');

        const btn2P = document.getElementById('btn-2p');
        const btnAI = document.getElementById('btn-ai');

        let gameActive = false;
        let isGameOver = false;
        let gameMode = '2P';

        // Web Audio API setup
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBoop(freq, type = 'square', duration = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speedX: 5,
            speedY: 5,
            color: '#00ffff',
            trail: []
        };

        const paddleLeft = {
            x: 10,
            y: canvas.height / 2 - 50,
            width: 15,
            height: 100,
            score: 0,
            color: '#ff00ff'
        };

        const paddleRight = {
            x: canvas.width - 25,
            y: canvas.height / 2 - 50,
            width: 15,
            height: 100,
            score: 0,
            color: '#ff00ff'
        };

        let upPressed = false;
        let downPressed = false;
        let wPressed = false;
        let sPressed = false;

        btn2P.addEventListener('click', () => {
            gameMode = '2P';
            startGame();
        });

        btnAI.addEventListener('click', () => {
            gameMode = 'AI';
            startGame();
        });

        function startGame() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            menuOverlay.style.display = 'none';
            gameActive = true;
            paddleLeft.score = 0;
            paddleRight.score = 0;
            scoreLeftElement.innerText = '0';
            scoreRightElement.innerText = '0';
            resetBall();
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': upPressed = true; break;
                case 'ArrowDown': downPressed = true; break;
                case 'w': wPressed = true; break;
                case 's': sPressed = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': upPressed = false; break;
                case 'ArrowDown': downPressed = false; break;
                case 'w': wPressed = false; break;
                case 's': sPressed = false; break;
            }
        });

        function drawRect(x, y, w, h, color, glow) {
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = glow;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
        }

        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.speedY = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.trail = [];
        }

        function drawGrid() {
            const time = Date.now() * 0.001;
            const horizon = canvas.height * 0.6;

            ctx.strokeStyle = '#440066';
            ctx.lineWidth = 1;

            // Perspective calculation
            // x_proj = x / (z + constant)
            // y_proj = y / (z + constant)
            // For a synthwave look, we can just draw a grid that "moves"
            // by shifting its origin.

            const gridSpacing = 40;
            const moveOffset = (time * 50) % gridSpacing;

            // Draw horizontal lines (vanishing into horizon)
            for (let i = 0; i < 20; i++) {
                let z = i * 100;
                let y_pos = horizon + (z * 0.5); // Simplified perspective
                if (y_pos < canvas.height) {
                    ctx.beginPath();
                    ctx.moveTo(0, y_pos);
                    ctx.lineTo(canvas.width, y_pos);
                    ctx.stroke();
                }
            }

            // Draw vertical lines (converging to horizon)
            for (let i = -10; i < 20; i++) {
                let x_pos = (i * gridSpacing) - moveOffset;
                ctx.beginPath();
                ctx.moveTo(x_pos, canvas.height);
                ctx.lineTo(canvas.width / 2, horizon);
                ctx.stroke();
            }
        }

        function update() {
            if (!gameActive || isGameOver) return;

            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Trail update
            ball.trail.push({x: ball.x, y: ball.y});
            if (ball.trail.length > 15) {
                ball.trail.shift();
            }

            // Wall collision
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
                playBoop(200, 'square', 0.05);
            }

            // Paddle Left collision
            if (ball.x - ball.radius < paddleLeft.x + paddleLeft.width &&
                ball.y > paddleLeft.y && ball.y < paddleLeft.y + paddleLeft.height) {
                ball.speedX = -ball.speedX;
                ball.speedX *= 1.05;
                playBoop(300, 'square', 0.05);
            }

            // Paddle Right collision
            if (ball.x + ball.radius > paddleRight.x &&
                ball.y > paddleRight.y && ball.y < paddleRight.y + paddleRight.height) {
                ball.speedX = -ball.speedX;
                ball.speedX *= 1.05;
                playBoop(300, 'square', 0.05);
            }

            // Score
            if (ball.x < 0) {
                paddleRight.score++;
                scoreRightElement.innerText = paddleRight.score;
                resetBall();
            } else if (ball.x > canvas.width) {
                paddleLeft.score++;
                scoreLeftElement.innerText = paddleLeft.score;
                resetBall();
            }

            // Win Condition
            if (paddleLeft.score >= 20 || paddleRight.score >= 20) {
                isGameOver = true;
                setTimeout(() => {
                    isGameOver = false;
                    gameActive = false;
                    menuOverlay.style.display = 'flex';
                }, 3000);
            }

            // Movement
            if (wPressed && paddleLeft.y > 0) paddleLeft.y -= 7;
            if (sPressed && paddleLeft.y < canvas.height - paddleLeft.height) paddleLeft.y += 7;

            if (gameMode === '2P') {
                if (upPressed && paddleRight.y > 0) paddleRight.y -= 7;
                if (downPressed && paddleRight.y < canvas.height - paddleRight.height) paddleRight.y += 7;
            } else {
                // AI Movement
                const aiSpeed = 5;
                const paddleCenter = paddleRight.y + paddleRight.height / 2;

                if (paddleCenter < ball.y - 10) {
                    paddleRight.y += aiSpeed;
                } else if (paddleCenter > ball.y + 10) {
                    paddleRight.y -= aiSpeed;
                }

                if (paddleRight.y < 0) paddleRight.y = 0;
                if (paddleRight.y > canvas.height - paddleRight.height) paddleRight.y = canvas.height - paddleRight.height;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Grid
            drawGrid();

            // 2. Draw Center Line
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            if (gameActive) {
                // 3. Draw Trail
                ball.trail.forEach((pos, index) => {
                    const alpha = (index / ball.trail.length) * 0.8;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
                    ctx.fill();
                });

                // 4. Draw Objects
                drawRect(paddleLeft.x, paddleLeft.y, paddleLeft.width, paddleLeft.height, paddleLeft.color, paddleLeft.color);
                drawRect(paddleRight.x, paddleRight.y, paddleRight.width, paddleRight.height, paddleRight.color, paddleRight.color);
                drawCircle(ball.x, ball.y, ball.radius, ball.color);
            }
            if (isGameOver) {
                ctx.fillStyle = '#ff00ff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff00ff';
                ctx.font = 'bold 60px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let winnerText = paddleLeft.score >= 20 ? 'Player 1 Wins!' : 'Player 2 / AI Wins!';
                ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
            }

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
